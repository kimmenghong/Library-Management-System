{% extends "base.html" %}

{% block title %}{{ announcement.title }} | Announcements{% endblock %}

{% block content %}
<div class="content-panel">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
        <div>
            <h1 class="h3 mb-1">{{ announcement.title }}</h1>
            <p class="text-muted mb-0">{{ announcement.publish_date|date:"M d, Y H:i" }} · <span class="badge status-{{ announcement.status }}">{{ announcement.get_status_display }}</span></p>
        </div>
        <a class="btn btn-outline-primary" href="{% url 'announcements:update' announcement.pk %}">Edit</a>
    </div>
    <p class="mb-0">{{ announcement.content|linebreaksbr }}</p>
</div>
{% endblock %}
