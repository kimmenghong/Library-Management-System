{% extends "library/base.html" %}
{% load static %}

{% block title %}Password Updated | Library Management System{% endblock %}

{% block content %}
{% get_static_prefix as STATIC_PREFIX %}
<div class="auth-page-shell">
    <div class="auth-panel shadow-sm">
        <div class="row g-0 align-items-stretch">
            <div class="col-lg-7">
                <div class="auth-image-wrap">
                    <img
                        src="{{ STATIC_PREFIX }}images/library-login.jpg"
                        class="auth-image"
                        alt="University library reading area"
                    >
                </div>
            </div>
            <div class="col-lg-5">
                <div class="auth-form-panel">
                    <div class="auth-kicker">Success</div>
                    <h1 class="h4 mb-1">Password Updated</h1>
                    <p class="text-secondary mb-4">Your password has been changed successfully.</p>
                    <a class="btn btn-primary w-100" href="{% url 'library:login' %}">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
