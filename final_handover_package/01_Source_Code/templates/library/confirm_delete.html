{% extends "library/base.html" %}

{% block title %}{{ title }} | Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="bg-white border rounded shadow-sm p-4">
            <h1 class="h4">{{ title }}</h1>
            <p>Delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    {% if cancel_url %}
                        <a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancel</a>
                    {% else %}
                        <button class="btn btn-outline-secondary" type="button" onclick="history.back()">Cancel</button>
                    {% endif %}
                    <button class="btn btn-danger" type="submit">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
