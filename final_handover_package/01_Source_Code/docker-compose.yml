services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library_management
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --config gunicorn.conf.py"
    environment:
      DJANGO_SECRET_KEY: change-this-secret-key-before-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: library_management
      DATABASE_USER: library_user
      DATABASE_PASSWORD: library_password
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SECURE: "False"
      SECURE_SSL_REDIRECT: "False"
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  backup_data:
