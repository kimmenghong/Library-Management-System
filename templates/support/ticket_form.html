{% extends "base.html" %}

{% block title %}Contact Support | Library Management System{% endblock %}

{% block content %}
<div class="content-panel">
    <h1 class="h3 mb-3">Contact Support</h1>
    <form method="post" class="row g-3">
        {% csrf_token %}
        {% for field in form %}
            <div class="{% if field.name == 'message' %}col-12{% else %}col-md-6{% endif %}">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Submit Ticket</button>
            <a class="btn btn-outline-secondary" href="{% url 'support:ticket_list' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
