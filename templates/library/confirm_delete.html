{% extends "library/base.html" %}

{% block title %}{{ title }} | Library Management System{% endblock %}

{% block content %}
<div class="admin-form-page">
    <div class="admin-form-shell">
        <div class="admin-form-card">
            <p class="admin-form-kicker">Confirmation</p>
            <h1 class="admin-form-title h4">{{ title }}</h1>
            <p>Delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="admin-form-actions">
                    {% if cancel_url %}
                        <a class="btn admin-form-cancel" href="{% url cancel_url %}">Cancel</a>
                    {% else %}
                        <button class="btn admin-form-cancel" type="button" onclick="history.back()">Cancel</button>
                    {% endif %}
                    <button class="btn btn-danger" type="submit">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
