name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECRET_KEY: ci-library-management-system-secret-key-for-tests-only
  DEBUG: "True"
  ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
  DATABASE_ENGINE: sqlite
  SQLITE_NAME: /tmp/library-ci.sqlite3
  USE_SUPABASE_AUTH: "False"
  LOG_DIR: /tmp/library-ci-logs
  STATIC_ROOT: /tmp/library-ci-staticfiles
  MEDIA_ROOT: /tmp/library-ci-media
  FINE_RATE_PER_DAY: "1.00"

jobs:
  quality:
    name: Code quality and security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check apps/library config manage.py

      - name: Check import order with isort
        run: isort --check-only apps/library config manage.py

      - name: Lint with Flake8
        run: flake8 apps/library config manage.py

      - name: Security scan with Bandit
        run: bandit -r apps/library config manage.py -x apps/library/migrations -s B105

      - name: Dependency vulnerability scan with Safety
        run: safety check -r requirements.txt --full-report

  test:
    name: Django checks, migrations, and tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to CI database
        run: python manage.py migrate --noinput

      - name: Run unit and integration tests
        run: python manage.py test

      - name: Verify static build
        run: python manage.py collectstatic --noinput

  build:
    name: Production configuration verification
    runs-on: ubuntu-latest
    needs: test
    env:
      DEBUG: "False"
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: example.com
      CSRF_TRUSTED_ORIGINS: https://example.com
      DATABASE_ENGINE: sqlite
      SQLITE_NAME: /tmp/library-build.sqlite3
      USE_SUPABASE_AUTH: "False"
      USE_X_FORWARDED_PROTO: "True"
      CSRF_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      LOG_DIR: /tmp/library-build-logs
      STATIC_ROOT: /tmp/library-build-staticfiles
      MEDIA_ROOT: /tmp/library-build-media

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run production deployment checks
        run: python manage.py check --deploy

      - name: Build static assets
        run: python manage.py collectstatic --noinput

      - name: Verify Gunicorn import
        run: python -c "import config.wsgi; print('WSGI import OK')"
